name: Frontend Build Check
on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
