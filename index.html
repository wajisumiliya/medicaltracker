
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ecfdf5" />
    <meta name="description" content="Private health tracking for the whole family" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Koala Family | Private Family Health</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fafafa;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        color: #1f2937;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Quicksand', sans-serif;
      }
      .Tamil-font {
        font-family: 'Inter', 'Quicksand', sans-serif;
        line-height: 1.6;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f9fafb;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e7eb;
        border-radius: 10px;
        border: 2px solid #f9fafb;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d1d5db;
      }


      :root {color-scheme:light; font-synthesis:none;}
      html {scroll-behavior:smooth;}
      body {font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility;}
      button,input,textarea,select {font:inherit;}
      button {cursor:pointer;}
      button:disabled {cursor:not-allowed;}
      :where(button,a,input,textarea,select):focus-visible {outline:3px solid #10b981;outline-offset:3px;}
      ::selection {background:#a7f3d0;color:#064e3b;}
      .koala-profile-switcher {scrollbar-width:thin;scrollbar-color:#a7f3d0 transparent;}
      #root {min-height:100dvh;}
      @media (prefers-reduced-motion:reduce) {*,*::before,*::after {animation-duration:0.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:0.01ms!important;}}
      @media (max-width:767px) {input,textarea,select {font-size:16px!important;} main {overflow-wrap:anywhere;}}
      .koala-dark .premium-surface,.koala-dark .bg-white,.koala-dark .bg-white\/95 {background:#1e293b!important;color:#f8fafc!important;border-color:#334155!important;}
      .koala-dark .text-slate-800,.koala-dark .text-slate-700 {color:#f8fafc!important;}
      .koala-dark .text-slate-500,.koala-dark .text-gray-500 {color:#cbd5e1!important;}
      .koala-dark input,.koala-dark textarea,.koala-dark select {background:#334155!important;color:#f8fafc!important;border-color:#475569!important;}
      .premium-surface {background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.8);border-radius:1.75rem;box-shadow:0 12px 42px rgba(15,23,42,.045);}
      .premium-surface:hover {box-shadow:0 16px 48px rgba(15,23,42,.07);}
      .premium-input {background:#f8fafc;border:1px solid #e2e8f0;border-radius:1rem;padding:.85rem 1rem;transition:border-color .2s,box-shadow .2s;}
      .premium-input:focus {outline:none;border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12);}
      .premium-action {background:linear-gradient(115deg,#059669,#0d9488);color:white;border-radius:1rem;padding:.8rem 1.2rem;font-weight:700;box-shadow:0 8px 18px rgba(5,150,105,.14);transition:transform .2s,box-shadow .2s;}
      .premium-action:hover {transform:translateY(-1px);box-shadow:0 12px 24px rgba(5,150,105,.2);}
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
      }
      .animate-shake {
        animation: shake 0.4s ease-in-out;
      }
      @media (min-width: 1280px) {
        .dashboard-fit {
          grid-template-columns: repeat(12, minmax(0, 1fr));
          align-items: start;
        }
        .dashboard-fit > * { grid-column: 1 / -1; }
        .dashboard-child > section:nth-child(3) { grid-column: span 7; }
        .dashboard-child > div:nth-child(4) { grid-column: span 5; }
        .dashboard-liyan > section:nth-child(5) { grid-column: span 4; }
        .dashboard-liyan > div:nth-child(6) { grid-column: span 8; }
      }
      @media (min-width: 1024px) and (max-height: 820px) {
        .dashboard-fit { gap: 0.75rem; }
        .dashboard-fit article { padding: 0.875rem; }
        .dashboard-fit section > div { margin-top: 0; }
      }
      @media (max-width: 767px) {
        .dashboard-fit {
          gap: 0.75rem;
        }
        .dashboard-fit > section:first-child {
          padding: 0.75rem;
          flex-direction: row;
          align-items: center;
        }
        .dashboard-fit > section:first-child img,
        .dashboard-fit > section:first-child > div > div:first-child {
          width: 3.25rem;
          height: 3.25rem;
        }
        .dashboard-fit > section:first-child > button {
          width: 2.75rem;
          height: 2.75rem;
          padding: 0;
          flex: 0 0 auto;
          font-size: 0;
        }
        .dashboard-fit > section:nth-child(2) > div:nth-child(2) {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.5rem;
        }
        .dashboard-fit > section:nth-child(2) > div:nth-child(2) > article {
          min-width: 0;
          padding: 0.75rem;
        }
        .dashboard-child > section:nth-child(3) > div:nth-child(2) {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.5rem;
          overflow: visible;
        }
        .dashboard-fit > div:last-of-type {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
          overflow: visible;
        }
        .dashboard-child > section:nth-child(3) > div:nth-child(2) > div,
        .dashboard-fit > div:last-of-type > section {
          min-width: 0;
        }
        .dashboard-fit > section:nth-child(2) h4 { font-size: 0.75rem; }
        .dashboard-fit > section:nth-child(2) article > p.text-4xl,
        .dashboard-fit > section:nth-child(2) article > p.text-3xl { font-size: 1.25rem; }
        .dashboard-fit > section:nth-child(2) article .grid p:first-child { font-size: 0.75rem; }
        .dashboard-fit > section:nth-child(2) article > .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .dashboard-fit > section:nth-child(2) article > .grid > div:first-child {
          grid-column: 1 / -1;
        }
        .dashboard-fit > section:nth-child(2) article > .grid > div:first-child p:first-child {
          font-size: 1rem;
          overflow: visible;
          text-overflow: clip;
        }
        .dashboard-child > div:nth-child(4),
        .dashboard-adult > div:nth-child(3) {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0.5rem;
        }
        .dashboard-child > div:nth-child(4) > div,
        .dashboard-adult > div:nth-child(3) > div {
          padding: 0.75rem;
          min-width: 0;
        }
        .dashboard-child > div:nth-child(4) > div > div:first-child,
        .dashboard-adult > div:nth-child(3) > div > div:first-child {
          width: 2rem;
          height: 2rem;
        }
        .dashboard-child > div:nth-child(4) p:nth-of-type(1),
        .dashboard-adult > div:nth-child(3) p:nth-of-type(1) {
          margin-top: 0.5rem;
          font-size: 0.55rem;
        }
        .dashboard-child > div:nth-child(4) p:nth-of-type(2),
        .dashboard-adult > div:nth-child(3) p:nth-of-type(2) {
          font-size: 0.8rem;
          overflow-wrap: anywhere;
        }
      }
    </style>

{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

}
</script>
</head>
  <body>
    <div id="root"></div>

</body>
</html>
